name: Deploy

# Ships main to production after CI passes (or on demand). Configured via
# repository variables set from `terraform output` (see infra/README.md); until
# AWS_DEPLOY_ROLE_ARN is set, the jobs are skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC → AWS, no stored keys
  contents: read

env:
  AWS_REGION: us-east-2
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  api:
    name: API → Lambda
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    # arm64 runner so argon2's native binary matches the arm64 Lambda.
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build -w @site/shared && npm run build -w @site/api

      - name: Migrate database
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Package
        run: scripts/package-api.sh api-lambda.zip

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy function code
        run: |
          key="api/${COMMIT}.zip"
          aws s3 cp api-lambda.zip "s3://${{ vars.ARTIFACTS_BUCKET }}/${key}"
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --s3-bucket "${{ vars.ARTIFACTS_BUCKET }}" --s3-key "${key}" >/dev/null
          aws lambda wait function-updated-v2 --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

  web:
    name: Web → S3 + CloudFront
    needs: api
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build -w @site/shared && npm run build -w @site/web

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload
        working-directory: apps/web/dist
        run: |
          bucket="s3://${{ vars.WEB_BUCKET }}"
          # Hashed assets are immutable. Old ones are kept so open tabs can still lazy-load chunks.
          aws s3 sync assets "${bucket}/assets" --cache-control "public,max-age=31536000,immutable"
          # Everything else (index.html, robots.txt, favicon) must revalidate.
          aws s3 sync . "${bucket}" --exclude "assets/*" --cache-control "no-cache" --delete

      - name: Invalidate
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/" "/index.html" >/dev/null

      - name: Smoke test
        run: |
          site="${{ vars.SITE_URL }}"
          # Allow for a Lambda cold start plus Neon resuming from idle.
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${site}/api/health" | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null "${site}/blog"
