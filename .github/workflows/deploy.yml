name: Deploy

# Ships main to production after CI passes (or on demand): the API to AWS
# Lambda, then the web build + edge Worker to Cloudflare. Configured via
# repository variables (see infra/README.md); until AWS_DEPLOY_ROLE_ARN is set,
# the jobs are skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC → AWS, no stored keys
  contents: read

env:
  AWS_REGION: us-east-2
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  api:
    name: API → Lambda
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    # arm64 runner so argon2's native binary matches the arm64 Lambda.
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build -w @site/shared && npm run build -w @site/api

      - name: Migrate database
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Package
        run: scripts/package-api.sh api-lambda.zip

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy function code
        run: |
          key="api/${COMMIT}.zip"
          aws s3 cp api-lambda.zip "s3://${{ vars.ARTIFACTS_BUCKET }}/${key}"
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --s3-bucket "${{ vars.ARTIFACTS_BUCKET }}" --s3-key "${key}" >/dev/null
          aws lambda wait function-updated-v2 --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

  edge:
    name: Web + Worker → Cloudflare
    needs: api
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build web
        run: npm run build -w @site/shared && npm run build -w @site/web

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Single source of truth: the origin secret is the same SSM value the
      # Lambda is configured with; the purge token lives next to it.
      - name: Worker secrets from SSM
        run: |
          : > "${RUNNER_TEMP}/worker.env"
          for name in ORIGIN_VERIFY_SECRET CACHE_PURGE_TOKEN; do
            secret="$(aws ssm get-parameter --name "/site/prod/${name}" --with-decryption --query Parameter.Value --output text)"
            echo "::add-mask::${secret}"
            printf '%s=%s\n' "${name}" "${secret}" >> "${RUNNER_TEMP}/worker.env"
          done

      # Reconciles the Worker, its static assets and custom domain to apps/edge/wrangler.jsonc.
      - name: Deploy Worker
        working-directory: apps/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file "${RUNNER_TEMP}/worker.env"

      - name: Smoke test
        run: |
          site="${{ vars.SITE_URL }}"
          # Allow for a Lambda cold start plus Neon resuming from idle.
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${site}/api/health" | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null "${site}/blog/hello-world"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://www.${site#https://}/about)" = 301
